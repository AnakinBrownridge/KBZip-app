name: Release

# Push a tag like v1.0.0 to build and publish an APK on the GitHub Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Test
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "KBZip-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: KBZip-*.apk
          generate_release_notes: true
